# The setup every stage that talks to AWS repeats: Python with the pipeline's packages,
# then GitHub OIDC sign-in to the pipeline role (pipeline/bootstrap). No stored AWS keys.
name: Python and AWS
description: Set up Python with the pipeline's packages, and sign in to AWS with GitHub OIDC

inputs:
  role-arn:
    description: The pipeline role, from the AWS_ROLE_ARN repository variable
    required: true
  region:
    description: AWS region
    required: true
  session-name:
    description: Shows in CloudTrail, so each stage's calls can be told apart
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pipeline/requirements.txt

    - name: Install the pipeline's packages
      shell: bash
      run: pip install --quiet -r pipeline/requirements.txt

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: ${{ inputs.session-name }}
        aws-region: ${{ inputs.region }}
