[pytest]
testpaths = tests
# The drift test builds a real Evidently report, and the libraries Evidently uses (numpy,
# scipy, pandas, litestar) warn about their own internals while it does. Not this
# project's code, and nothing to act on, so they are hidden. Warnings from our own code
# still show.
filterwarnings =
    ignore::DeprecationWarning:evidently.*
    ignore::DeprecationWarning:litestar.*
    ignore::RuntimeWarning:numpy.*
    ignore::RuntimeWarning:scipy.*
    ignore::FutureWarning:evidently.*
    ignore:.*keyword-only.*
    ignore::DeprecationWarning:numpy.*
    ignore:Call to deprecated function 'Dependency':DeprecationWarning
    ignore:Use of deprecated class 'DependencyKwarg':DeprecationWarning
